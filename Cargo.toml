[package]
name = "tpt-app-qr-batch"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]
members = [".", "engine", "desktop"]
resolver = "2"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
# Pro edition (paid desktop build): bulk CSV generation, custom
# branding/logo overlay, and print-ready sheet export (PDF/ZIP). The free
# WASM build compiles without it — default features are free,
# `--features pro` is Pro.
pro = ["tpt-qr-batch-engine/pro"]

[dependencies]
tpt-appfront-core = { path = "D:/Programming/1PRODUCTION/Open Source/tpt-appfront/crates/tpt-appfront-core" }
tpt-appfront-dom = { path = "D:/Programming/1PRODUCTION/Open Source/tpt-appfront/crates/tpt-appfront-dom" }
tpt-qr-batch-engine = { path = "engine" }
# Pinned to the installed wasm-bindgen CLI version — the CLI rejects wasm
# built against a different schema version. Bump both together.
wasm-bindgen = "=0.2.128"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Document",
    "Window",
    "Element",
    "Node",
    "HtmlElement",
    "HtmlInputElement",
    "HtmlTextAreaElement",
    "HtmlSelectElement",
    "HtmlHeadElement",
    "HtmlAnchorElement",
    "HtmlImageElement",
    "EventTarget",
    "KeyboardEvent",
    "Location",
    # File import (CSV + Pro logo upload): hidden file picker + FileReader.
    "File",
    "FileList",
    "FileReader",
    "Blob",
    "BlobPropertyBag",
    "Url",
    "Event",
] }
console_error_panic_hook = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# The desktop shell is a native binary; keep its codegen normal even in the
# same workspace (the `release` profile above applies to the wasm lib build).
[profile.release.package.tpt-qr-desktop]
opt-level = 3
